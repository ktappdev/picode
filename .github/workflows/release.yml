# Publish on every v* tag: `picode` to npmjs (primary — anonymous
# installs). Only the free suites run here (unit + MCP + typecheck + lint)
# — the e2e suites need a model API key and real spend, so they stay
# local/manual.
#
# The npmjs publish uses trusted publishing (OIDC) — no token secret, no
# OTP, works with 2FA-for-writes enabled. One-time setup on npmjs.com:
# package settings → Trusted Publisher → GitHub Actions → owner ktappdev,
# repo picode, workflow release.yml. The package must exist first
# (initial version published manually). Requires npm >= 11.5.1, hence the
# npm upgrade step.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:mcp

      # Refuse to publish a tag that disagrees with package.json.
      - name: Check tag matches package version
        if: github.ref_type == 'tag'
        run: |
          pkg="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json is $pkg but tag is $tag" >&2
            exit 1
          fi

      # Trusted publishing: npm mints its own credential from the runner's
      # OIDC identity — nothing to store, nothing for EOTP to block.
      - name: Publish picode to npmjs (OIDC)
        run: |
          npm install -g npm@latest
          npm publish --registry https://registry.npmjs.org --access public
